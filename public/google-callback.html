<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подключение календаря...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 40px; height: 40px;
      border-radius: 50%;
      border-left-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Подключение Google Календаря...</h2>
  <p>Возвращаем вас в Telegram</p>

  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');

    if (accessToken) {
      // ВАЖНО: Укажи точный юзернейм твоего бота
      const botUsername = "atriumtask_bot"; 
      
      // Telegram Deep Link
      const telegramDeepLink = `https://t.me/${botUsername}/app?startapp=gcal_${accessToken}`;
      
      window.location.href = telegramDeepLink;
    } else {
      document.body.innerHTML = "<h3>Ошибка авторизации. Закройте окно.</h3>";
    }
  </script>
</body>
</html>
